[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

lib_deps =
    pololu/DualMAX14870MotorShield
    adafruit/Adafruit BNO055
    pixy2
    ErickSimoes/Ultrasonic @ ^3.0.0
